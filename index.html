<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140b14"><title>Рита — фан-страница</title><meta name="description" content="Неофициальная фан-страница Риты: стримы, игры, общение и ссылки."><link rel="stylesheet" href="style.css"></head><body><p id="load-error" role="alert" hidden>Не удалось загрузить данные страницы. Попробуйте обновить страницу.</p><template id="page-template"><div class="ambient"></div><header><a class="logo" href="#home">{{nick}}<span>♡</span></a><nav aria-label="Главная навигация"><a class="active" href="#home">⌂ <span>Главная</span></a><a href="#about">Обо мне</a><a href="#streams">Стримы</a><a href="#links">Все ссылки ↗</a></nav><span class="header-note">неофициальная фан-страница</span></header><main><section class="hero" id="home"><div class="hero-copy"><div class="eyebrow"><span></span> STREAMING · GAMING · JUST CHATTING</div><p class="hello">{{name}} · {{age}}</p><h1>Рита<span>♡</span></h1><div class="nickname">{{nick}} / TWITCH</div><p class="subtitle">Кринж, игры<br>и разговоры.</p><p class="intro">«{{tagline}}»</p><div class="actions"><a class="button primary" href="{{links.twitch}}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3H22V15L16 21H12L8 24V21H3V7Z M7 5V17H11V20L14 17H18L20 15V5Z M11 8V13 M16 8V13"/></svg>Смотреть на Twitch <span>↗</span></a><a class="button secondary" href="#links">Соцсети ↓</a></div><div class="stream-note"><i></i> Русскоязычный канал · Twitch {{twitch_status}}</div></div><div class="hero-art" aria-label="Декоративная иллюстрация розового неонового кота"><div class="orbit o1"></div><div class="orbit o2"></div><span class="spark s1">✧</span><span class="spark s2">✦</span><span class="heart h1">♡</span><span class="heart h2">♡</span><svg class="cat" viewBox="0 0 400 410" fill="none" aria-hidden="true"><defs><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter></defs><g stroke="#ff73b9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M111 184 96 103 170 142Q200 131 233 142L302 103 291 185Q328 219 304 273Q276 323 201 324Q121 322 96 273Q72 223 111 184Z"/><path d="m145 220 24 24m0-24-24 24m87-24 24 24m0-24-24 24m-64 17 13 10 13-10m-13 10v16m-95-57-55-10m59 32-59 8m237-30 55-10m-59 32 59 8M161 113l-8-49 38 25 22-48 20 46 39-26-11 50"/></g></svg><div class="art-label"><span>♡</span> welcome to my little world</div><span class="vertical">STAY A LITTLE LONGER</span></div><div class="hero-bottom"><span>Хорошая компания. Любимые игры. Тот самый вайб.</span><span>SCROLL TO EXPLORE ↓</span></div></section><section class="stats" aria-label="Статистика канала"><div><b>{{followers_label}} <span>/ {{goal_label}}</span></b><p>фолловеров · до цели {{remaining}}</p><progress value="{{stats.followers}}" max="{{stats.followers_goal}}" aria-label="{{stats.followers}} из {{stats.followers_goal}} фолловеров"></progress></div><div><b>≈{{stats.avg_viewers}}</b><p>средний онлайн</p></div><div><b>≈{{stats.peak_viewers}}</b><p>пик зрителей</p></div><small>Срез на {{stats.as_of}}<br>{{stats.source}}.<br>Обновляется вручную, текущие значения могут отличаться.</small></section><section class="cards"><article class="panel about" id="about"><div class="section-label">01 / ЗНАКОМСТВО</div><h2>За ником — человек <span>♡</span></h2><p>{{name}}, {{age}}. «{{about}}»</p><p class="muted">Канал создан {{created_label}}.</p><span class="signature">из описания Twitch ♡</span></article><article class="panel games"><div class="section-label">02 / НАСТРОЕНИЕ</div><h2>Во что сыграем?</h2><div class="game-grid confirmed-games"><div class="game dota"><span class="game-symbol">◩</span><b>{{formats.1}}</b><small>игры</small></div><div class="game rim"><span class="game-symbol">☏</span><b>{{formats.0}}</b><small>общение</small></div></div><p class="caption">Игры и форматы канала</p></article><article class="panel support"><div class="section-label">03 / ПОДДЕРЖКА</div><h2>Чуть больше тепла <span>♡</span></h2><p>«{{support_text}}»</p><a class="support-link" href="{{links.donationalerts}}" target="_blank" rel="noopener noreferrer">DonationAlerts <span>↗</span><small>Поддержать стримы</small></a><a class="support-link" href="{{links.boosty}}" target="_blank" rel="noopener noreferrer">Boosty <span>↗</span><small>Ближе к сообществу</small></a></article></section><section class="stream-section" id="streams"><div><div class="section-label">МЕСТО ВСТРЕЧИ</div><h2>Поймаемся в эфире?</h2><p>Трансляции — на Twitch. {{videos_note}}<br>Последний известный эфир: «{{last_stream}}».<br>В расписании канала: {{schedule}}.</p></div><a class="button primary" href="{{links.twitch}}" target="_blank" rel="noopener noreferrer">Перейти на канал <span>↗</span></a></section><section id="links" class="links"><div class="links-title">Всегда на связи <span>♡</span></div><a href="{{links.twitch}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">◧</span><div>Twitch<small>{{nick}}</small></div><span>↗</span></a><a href="{{links.telegram}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">➤</span><div>Telegram<small>{{handles.social}}</small></div><span>↗</span></a><a href="{{links.instagram}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">◎</span><div>Instagram<small>{{handles.social}}</small></div><span>↗</span></a><a href="{{links.steam}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">♧</span><div>Steam<small>{{handles.steam}}</small></div><span>↗</span></a></section><div class="player-ids"><button data-copy="{{ids.battletag}}">Battle.tag <b>{{ids.battletag}}</b> <span>Копировать ⧉</span></button><button data-copy="{{ids.dota2}}">Dota 2 ID <b>{{ids.dota2}}</b> <span>Копировать ⧉</span></button></div><footer><a class="logo" href="#home">{{nick}}<span>♡</span></a><span>Неофициальная фан-страница · не связана с Ритой</span><span>Фан-проект · <span id="year"></span></span></footer></main><div class="toast" role="status" aria-live="polite"></div></template><div id="app"></div><script src="script.js"></script></body></html>
