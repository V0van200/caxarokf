<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#040917"><title>Рита — фан-страница</title><meta name="description" content="Неофициальная фан-страница Риты: стримы, игры, общение и ссылки."><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css"></head><body><p id="load-error" role="alert" hidden>Не удалось загрузить данные страницы. Попробуйте обновить страницу.</p><template id="page-template"><canvas id="universe" aria-hidden="true"></canvas><div class="ambient"></div><div class="grain" aria-hidden="true"></div><div class="scroll-progress" aria-hidden="true"></div><header><a class="logo" href="#home">{{nick}}<span>♡</span></a><nav aria-label="Главная навигация"><a class="active" href="#home">⌂ <span>Главная</span></a><a href="#about">Обо мне</a><a href="#streams">Стримы</a><a href="#links">Все ссылки ↗</a></nav><span class="header-note"><span class="status-dot"></span> FAN UNIVERSE / 001</span></header><main><section class="hero" id="home"><div class="hero-copy"><div class="eyebrow"><span></span> ENTER THE ORBIT / CAXAROKF</div><p class="hello"><span class="tiny-cross">✦</span> {{name}}</p><h1>Рита<span>✦</span></h1><div class="nickname">{{nick}} / TWITCH</div><p class="subtitle">Кринж, игры<br>и разговоры.</p><p class="intro">«{{tagline}}»</p><div class="actions"><a class="button primary" href="{{links.twitch}}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3H22V15L16 21H12L8 24V21H3V7Z M7 5V17H11V20L14 17H18L20 15V5Z M11 8V13 M16 8V13"/></svg>Смотреть на Twitch <span>↗</span></a><a class="button secondary" href="#links">Соцсети ↓</a></div><div class="stream-note"><i></i> Русскоязычный канал · Twitch {{twitch_status}}</div></div><figure class="hero-portrait"><div class="portrait-cross top-left">+</div><div class="portrait-cross bottom-right">+</div><span class="frame-code">CXR / 001 — PERSONAL ORBIT</span><img src="{{portrait.src}}" alt="{{portrait.alt}}" width="1536" height="1024" fetchpriority="high"><figcaption>{{portrait.caption}}</figcaption><div class="portrait-badge"><span>✦</span><div>В своей вселенной<small>GAMING · CHATTING · REPEAT</small></div></div></figure><div class="hero-bottom"><span>Хорошая компания. Любимые игры. Тот самый вайб.</span><span>SCROLL TO EXPLORE ↓</span></div></section><div class="signal-strip" aria-hidden="true"><div>STAY IN THE ORBIT <i>✦</i> GOOD GAMES, REAL MOMENTS <i>✦</i> CAXAROKF UNIVERSE <i>✦</i> STAY IN THE ORBIT <i>✦</i> GOOD GAMES, REAL MOMENTS <i>✦</i> CAXAROKF UNIVERSE <i>✦</i></div></div><section class="stats" aria-label="Статистика канала"><div><b>{{followers_label}} <span>/ {{goal_label}}</span></b><p>фолловеров · до цели {{remaining}}</p><progress value="{{stats.followers}}" max="{{stats.followers_goal}}" aria-label="{{stats.followers}} из {{stats.followers_goal}} фолловеров"></progress></div><div><b>≈{{stats.avg_viewers}}</b><p>средний онлайн</p></div><div><b>≈{{stats.peak_viewers}}</b><p>пик зрителей</p></div><small>Срез на {{stats.as_of}}<br>{{stats.source}}.<br>Обновляется вручную, текущие значения могут отличаться.</small></section><div class="chapter"><span>01 — INSIDE THE UNIVERSE</span><p>Тот самый вайб<span>↘</span></p></div><section class="cards"><article class="panel about" id="about"><div class="section-label">01 / ЗНАКОМСТВО</div><h2>За ником — человек <span>♡</span></h2><p>{{name}}. «{{about}}»</p><p class="muted">Канал создан {{created_label}}.</p><span class="signature">из описания Twitch ♡</span></article><article class="panel games"><div class="section-label">02 / НАСТРОЕНИЕ</div><h2>Во что сыграем?</h2><div class="game-grid confirmed-games"><div class="game dota"><span class="game-symbol">◩</span><b>{{formats.1}}</b><small>игры</small></div><div class="game rim"><span class="game-symbol">☏</span><b>{{formats.0}}</b><small>общение</small></div></div><p class="caption">Игры и форматы канала</p></article><article class="panel support"><div class="section-label">03 / ПОДДЕРЖКА</div><h2>Чуть больше тепла <span>♡</span></h2><p>«{{support_text}}»</p><a class="support-link" href="{{links.donationalerts}}" target="_blank" rel="noopener noreferrer">DonationAlerts <span>↗</span><small>Поддержать стримы</small></a><a class="support-link" href="{{links.boosty}}" target="_blank" rel="noopener noreferrer">Boosty <span>↗</span><small>Ближе к сообществу</small></a></article></section><section class="stream-section" id="streams"><div><div class="section-label">МЕСТО ВСТРЕЧИ</div><h2>Поймаемся в эфире?</h2><p>Трансляции — на Twitch. {{videos_note}}<br>Последний известный эфир: «{{last_stream}}».<br>В расписании канала: {{schedule}}.</p></div><a class="button primary" href="{{links.twitch}}" target="_blank" rel="noopener noreferrer">Перейти на канал <span>↗</span></a></section><section id="links" class="links"><div class="links-title">Всегда на связи <span>♡</span></div><a href="{{links.twitch}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">◧</span><div>Twitch<small>{{nick}}</small></div><span>↗</span></a><a href="{{links.telegram}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">➤</span><div>Telegram<small>{{handles.social}}</small></div><span>↗</span></a><a href="{{links.instagram}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">◎</span><div>Instagram<small>{{handles.social}}</small></div><span>↗</span></a><a href="{{links.steam}}" target="_blank" rel="noopener noreferrer"><span class="social-icon">♧</span><div>Steam<small>{{handles.steam}}</small></div><span>↗</span></a></section><div class="player-ids"><button data-copy="{{ids.battletag}}">Battle.tag <b>{{ids.battletag}}</b> <span>Копировать ⧉</span></button><button data-copy="{{ids.dota2}}">Dota 2 ID <b>{{ids.dota2}}</b> <span>Копировать ⧉</span></button></div><footer><a class="logo" href="#home">{{nick}}<span>♡</span></a><span>Неофициальная фан-страница · не связана с Ритой</span><span>Фан-проект · <span id="year"></span></span></footer></main><div class="toast" role="status" aria-live="polite"></div></template><div id="app"></div><button id="fx-toggle" class="fx-toggle" type="button" aria-pressed="true" aria-label="Переключить анимацию фона">✦ FX ON</button><script src="script.js"></script><script type="module" src="universe.js"></script></body></html>
