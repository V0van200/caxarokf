<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a101b"><title>Рита — стримы, игры и разговоры</title>
<meta name="description" content="Фан-страница Риты (caxarokf): Twitch, общение, Dota 2, расписание и ссылки.">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css">
</head>
<body>
<p id="load-error" role="alert" hidden>Не удалось загрузить данные. Попробуй обновить страницу.</p>
<template id="page-template">
<canvas id="universe" aria-hidden="true"></canvas><div class="ambient"></div><div class="scroll-progress" aria-hidden="true"></div>
<header><a class="logo" href="#home">рита<span>♡</span><small>{{nick}}</small></a><nav aria-label="Навигация"><a class="active" href="#about">О Рите</a><a href="#streams">Стримы</a><a href="#support">Поддержать</a><a href="#links">Ссылки ↗</a></nav><a class="header-twitch" href="{{links.twitch}}" target="_blank" rel="noopener noreferrer">Twitch ↗</a></header>
<main>
<section class="hero" id="home">
<div class="hero-copy"><div class="eyebrow">TWITCH / {{nick}}</div><h1>Кринж, игры<br>и разговоры<span>.*</span></h1><p class="hero-intro">{{hero_intro}}</p><div class="actions"><a class="button primary" href="{{links.twitch}}" target="_blank" rel="noopener noreferrer">Смотреть на Twitch <span>↗</span></a><a class="button text-button" href="#about">Познакомиться ↓</a></div><p class="hero-footnote">Общение · Dota 2 · на русском</p></div>
<figure class="hero-portrait"><img src="{{portrait.src}}" alt="{{portrait.alt}}" width="1536" height="1024" fetchpriority="high"><span class="photo-mark">риточка / {{nick}}</span><figcaption>{{portrait.caption}}</figcaption></figure>
</section>
<section class="about-section" id="about"><div class="margin-note">01 / О РИТЕ<span>С её слов</span></div><div class="about-content"><blockquote>«{{tagline}}»</blockquote><div class="about-columns"><p>{{about}}</p><div class="about-facts"><span>Язык эфиров<b>Русский</b></span><span>На Twitch с<b>{{created_label}}</b></span><span>Статус канала<b>{{twitch_status}}</b></span></div></div></div></section>
<section class="streams-section" id="streams"><div class="section-heading"><div><div class="eyebrow">02 / ЧТО НА СТРИМАХ</div><h2>То болтаем, то в катке.</h2></div><span class="hand-note">как пойдёт ↙</span></div><div class="format-grid"><article class="format-card panel chat-card"><span class="format-number">01</span><div class="chat-art" aria-hidden="true"><span>ну привет</span><span>ещё по одной? <i>♡</i></span><span>чат, вы тут?</span></div><h3>Просто общение</h3><p>{{format_descriptions.chat}}</p><span class="format-tag">{{formats.0}}</span></article><article class="format-card panel dota-card"><span class="format-number">02</span><div class="dota-art" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M15 9 90 19 82 90 7 80Z" fill="currentColor"/><path d="m28 22 49 53-19-5-29-27Zm34 3 15 3-2 17Zm-42 34 19 16-21-3Z" fill="#121923"/></svg><span>DOTA<br>2</span></div><h3>Dota 2</h3><p>{{format_descriptions.dota}}</p><button class="copy-inline" data-copy="{{ids.dota2}}">ID {{ids.dota2}} <span>Копировать ⧉</span></button></article></div>
<div class="broadcast-info"><article class="latest-stream"><span class="small-label">ПОСЛЕДНИЙ ИЗВЕСТНЫЙ ЭФИР</span><h3>«{{last_stream}}»</h3><p>Общение · данные на {{stats.as_of}}</p><a href="{{links.twitch}}" target="_blank" rel="noopener noreferrer">Открыть канал ↗</a></article><article class="schedule"><span class="small-label">В РАСПИСАНИИ КАНАЛА</span><h3>{{schedule}}</h3><p>{{schedule_note}}</p></article></div></section>
<section class="channel-section"><div class="section-heading"><div><div class="eyebrow">03 / НЕБОЛЬШОЙ КАНАЛ, СВОЙ ЧАТ</div><h2>До пяти тысяч — совсем чуть-чуть.</h2></div></div><div class="channel-layout"><div class="follower-goal"><span class="goal-value">{{followers_label}}<small>/ {{goal_label}}</small></span><progress value="{{stats.followers}}" max="{{stats.followers_goal}}" aria-label="{{stats.followers}} из {{stats.followers_goal}} фолловеров"></progress><p>До цели канала осталось <b>{{remaining}}</b></p><a href="{{links.twitch}}" target="_blank" rel="noopener noreferrer">Подписаться на Twitch ↗</a></div><div class="channel-numbers"><div><b>≈{{stats.avg_viewers}}</b><span>средний онлайн</span></div><div><b>≈{{stats.peak_viewers}}</b><span>пик зрителей</span></div><p>{{community_note}}</p></div></div><p class="source-note">Срез на {{stats.as_of}} · {{stats.source}}. Статистика обновляется вручную и может отличаться от текущей.</p></section>
<section class="support-section" id="support"><div class="support-copy"><div class="eyebrow">04 / ЕСЛИ ХОЧЕТСЯ ПОДДЕРЖАТЬ</div><h2>На настроение.<br>И на следующий стрим.</h2><blockquote>«{{support_text}}»</blockquote><p>Из описания канала Риты</p></div><div class="support-options"><a href="{{links.donationalerts}}" target="_blank" rel="noopener noreferrer"><span class="support-icon">♡</span><div><h3>DonationAlerts</h3><p>Донат и заказ трека</p></div><span>↗</span></a><a href="{{links.boosty}}" target="_blank" rel="noopener noreferrer"><span class="support-icon">ϟ</span><div><h3>Boosty</h3><p>Страница Риты на Boosty</p></div><span>↗</span></a><small>Все кнопки ведут на внешние страницы Риты.</small></div></section>
<section class="links-section" id="links"><div class="section-heading"><div><div class="eyebrow">05 / НЕ ТЕРЯЙСЯ</div><h2>Всё в одном месте.</h2></div></div><div class="social-list"><a href="{{links.twitch}}" target="_blank" rel="noopener noreferrer"><span>01</span><h3>Twitch</h3><span>{{nick}}</span><b>↗</b></a><a href="{{links.telegram}}" target="_blank" rel="noopener noreferrer"><span>02</span><h3>Telegram</h3><span>@{{handles.social}}</span><b>↗</b></a><a href="{{links.instagram}}" target="_blank" rel="noopener noreferrer"><span>03</span><h3>Instagram</h3><span>@{{handles.social}}</span><b>↗</b></a><a href="{{links.steam}}" target="_blank" rel="noopener noreferrer"><span>04</span><h3>Steam</h3><span>{{handles.steam}}</span><b>↗</b></a></div><div class="player-ids"><button data-copy="{{ids.battletag}}">Battle.tag <b>{{ids.battletag}}</b><span>Копировать ⧉</span></button><button data-copy="{{ids.dota2}}">Dota 2 ID <b>{{ids.dota2}}</b><span>Копировать ⧉</span></button></div></section>
<section class="faq-section"><div class="margin-note">ПАРА ВОПРОСОВ</div><div class="faq-list"><details><summary>Где смотреть стримы?<span>+</span></summary><p>На Twitch: <a href="{{links.twitch}}" target="_blank" rel="noopener noreferrer">{{nick}} ↗</a>. Здесь собраны информация и ссылки, сама трансляция идёт на канале.</p></details><details><summary>А записи эфиров есть?<span>+</span></summary><p>{{archive_note}}</p></details><details><summary>Это официальный сайт?<span>+</span></summary><p>Нет, это фан-страница. Описание и ссылки собраны из открытых источников. Портрет создан с ИИ по кадрам стрима; Рита не заявлена автором этой страницы.</p></details></div></section>
<footer><a class="logo" href="#home">рита<span>♡</span></a><p>Фан-страница {{nick}}<small>Игры, разговоры и немного кринжа.</small></p><span>Обновлено по данным на {{stats.as_of}}<br>© <span id="year"></span> · фан-проект</span></footer>
</main><div class="toast" role="status" aria-live="polite"></div>
</template><div id="app"></div><button id="fx-toggle" class="fx-toggle" type="button" aria-pressed="true" aria-label="Переключить анимацию фона">✦ FX ON</button><script src="script.js"></script><script type="module" src="universe.js"></script>
</body></html>
